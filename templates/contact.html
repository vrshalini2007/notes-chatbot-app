\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>

    <!-- Your external CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1>Contact Form</h1>

    <!-- FORM -->
    <form action="/submit" method="POST">

        <!-- hidden id for update -->
        <input type="hidden" name="id" id="id">

        <input type="text" name="first_name" id="first_name" placeholder="First Name" required>

        <input type="text" name="last_name" id="last_name" placeholder="Last Name" required>

        <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>

        <input type="number" name="age" id="age" placeholder="Age" required>

        <textarea name="address" id="address" placeholder="Address" required></textarea>

        <input type="text" name="mobile_number" id="mobile_number" placeholder="Phone Number" required>

        <input type="email" name="email" id="email" placeholder="Email" required>

        <textarea name="description" id="description" placeholder="Description (Optional)"></textarea>

        <button type="submit">Submit</button>

    </form>

    <hr>

    <!-- TABLE -->
    <h2>Saved Records</h2>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for row in records %}
        <tr>
            <td>{{ row.first_name }} {{ row.last_name }}</td>
            <td>{{ row.mobile_number }}</td>
            <td>{{ row.email }}</td>

            <td>
                <button onclick='editRow({{ row | tojson | safe }})'>
                    Edit
                </button>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

<!-- EDIT SCRIPT -->
<script>
function editRow(data) {
    document.getElementById("id").value = data.id;

    document.getElementById("first_name").value = data.first_name;
    document.getElementById("last_name").value = data.last_name;
    document.getElementById("gender").value = data.gender;
    document.getElementById("age").value = data.age;
    document.getElementById("address").value = data.address;
    document.getElementById("mobile_number").value = data.mobile_number;
    document.getElementById("email").value = data.email;
    document.getElementById("description").value = data.description;
}
</script>

</body>
</html>
