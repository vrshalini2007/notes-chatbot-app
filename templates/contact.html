<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Notes Circle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <div class="logo">Notes Circle</div>

    <ul class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('contact') }}">Contact Us</a>
    </ul>
</nav>

<div class="container">

    <h1>Join Notes Circle</h1>

    <form id="contactForm">

        <input type="text" id="firstName" placeholder="First Name" required>

        <input type="text" id="lastName" placeholder="Last Name" required>

        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <input type="number" id="age" placeholder="Age" required>

        <textarea
            id="address"
            placeholder="Address"
            required
        ></textarea>

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <textarea
            id="description"
            placeholder="Description (Optional)"
        ></textarea>

        <button type="submit">
            Submit
        </button>

    </form>

    <h2>Submitted Details</h2>

    <table id="dataTable">

        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Gender</th>
                <th>Age</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Description</th>
                <th>Submitted Time</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody></tbody>

    </table>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
