<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Notes Circle</title>

    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Notes Circle
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="contact.html">Contact Us</a>
            </li>

        </ul>

    </nav>

    <!-- Contact Form -->

    <div class="container">

        <h1>Join Notes Circle</h1>

        <form id="contactForm">

            <input
                type="text"
                id="firstName"
                placeholder="First Name"
                required
            >

            <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                required
            >

            <select id="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <input
                type="number"
                id="age"
                placeholder="Age"
                required
            >

            <textarea
                id="address"
                placeholder="Address"
                required
            ></textarea>

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <textarea
                id="description"
                placeholder="Description (Optional)"
            ></textarea>

            <button type="submit">
                Submit
            </button>

        </form>

        <!-- Table -->

        <h2>Submitted Details</h2>

        <table id="dataTable">

            <thead>

                <tr>

                    <th>First Name</th>

                    <th>Last Name</th>

                    <th>Gender</th>

                    <th>Age</th>

                    <th>Address</th>

                    <th>Phone</th>

                    <th>Email</th>

                    <th>Description</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <script src="contact.js"></script>

</body>
</html>
